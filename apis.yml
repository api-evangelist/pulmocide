aid: pulmocide
name: Pulmocide
description: >-
  Pulmocide Ltd. is a privately held, clinical-stage biopharmaceutical company headquartered at 44
  Southampton Buildings in London, United Kingdom, with a US entity (Pulmocide Inc.) in Boston,
  Massachusetts. It develops novel inhaled medicines for pulmonary aspergillosis and other
  difficult-to-treat respiratory diseases, delivering drug directly to the site of infection in the
  lung to achieve high local exposure with low systemic exposure. Its lead asset is opelconazole
  (formerly PC945), an inhaled triazole antifungal active against Aspergillus that has received US
  FDA Orphan Drug, Fast Track and Qualified Infectious Disease Product designations; the company
  reported Phase 2 OPERA-S safety results in 2024 and announced termination of the Phase 3 OPERA-T
  study in 2025. Pulmocide is a drug developer, not a software or platform company: it publishes no
  developer program, no public API, no SDKs and no machine-readable API contract of any kind. This
  profile therefore records identity, corporate web properties and probed absence rather than API
  artifacts.
